apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql-deployment
  labels:
    app: psql-instance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psql-instance
  template:
    metadata:
      labels:
        app: psql-instance
    spec:
      containers:
      - name: psql-instance
        image: postgres:latest
        env:
        - name: POSTGRES_DB
          value: mydb
        - name: POSTGRES_USER
          value: admin
        - name: POSTGRES_PASSWORD
          value: "admin123"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: "/var/lib/postgresql/data"
          name: psql-pv-storage
      volumes:
      - name: psql-pv-storage
        persistentVolumeClaim:
          claimName: psql-pvc